name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin
      # Manual build instead of `autobuild`. CodeQL's autobuild script
      # picks the wrong Gradle target for this multi-module project and
      # fails immediately. `./gradlew assemble` compiles every subproject's
      # sources without running tests — exactly what CodeQL needs to
      # extract. (`classes` is not a root-project task on KMP-style
      # multi-module Gradle setups.)
      - name: Compile sources for CodeQL extraction
        run: ./gradlew --no-daemon assemble
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:java-kotlin"

