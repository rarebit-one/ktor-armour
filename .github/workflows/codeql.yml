name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java-kotlin
      # Manual build instead of `autobuild`. CodeQL's autobuild script
      # picks the wrong Gradle target for this multi-module project and
      # fails immediately. `./gradlew assemble` compiles every subproject's
      # sources without running tests — exactly what CodeQL needs to
      # extract. (`classes` is not a root-project task on KMP-style
      # multi-module Gradle setups.)
      - name: Compile sources for CodeQL extraction
        run: ./gradlew --no-daemon assemble
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:java-kotlin"

