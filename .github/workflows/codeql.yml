name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: java-kotlin
      # Manual build instead of `autobuild`. CodeQL's autobuild script
      # picks the wrong Gradle target for this multi-module project and
      # fails immediately. `./gradlew assemble` compiles every subproject's
      # sources without running tests — exactly what CodeQL needs to
      # extract. (`classes` is not a root-project task on KMP-style
      # multi-module Gradle setups.)
      - name: Compile sources for CodeQL extraction
        run: ./gradlew --no-daemon assemble
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: "/language:java-kotlin"

