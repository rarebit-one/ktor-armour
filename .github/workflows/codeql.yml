name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: java-kotlin
      # Manual build instead of `autobuild`. CodeQL's autobuild script
      # picks the wrong Gradle target for this multi-module project and
      # fails immediately. `./gradlew assemble` compiles every subproject's
      # sources without running tests — exactly what CodeQL needs to
      # extract. (`classes` is not a root-project task on KMP-style
      # multi-module Gradle setups.)
      - name: Compile sources for CodeQL extraction
        run: ./gradlew --no-daemon assemble
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:java-kotlin"

