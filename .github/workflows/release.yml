name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}  # granted per job below (least privilege)

jobs:
  release:
    uses: rarebit-one/.github/.github/workflows/reusable-maven-central-release.yml@v3  # moving major tag, auto-advanced on .github main (sre-brain#831)
    with:
      project-name: ktor-armour
    permissions:
      contents: write
    secrets: inherit

  # The outcome goes to the run summary. A failed release also surfaces in
  # Rarebit HQ's Decide tab (rarebit-sre decisions exporter reads the latest
  # release.yml run on a v* tag), so a failure never goes silent.
  summary:
    permissions: {}
    needs: release
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write release outcome to the run summary
        env:
          RESULT: ${{ needs.release.result }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$RESULT" = "success" ]; then
            echo "### Released \`${GITHUB_REPOSITORY}\` \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release failed (${RESULT}): \`${GITHUB_REPOSITORY}\` \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release ${TAG} finished with result ${RESULT}"
          fi
